# ─────────────────────────────────────────────────────────────
# Railway config — React / Vite Frontend
#
# Railway reads this file automatically when you deploy this
# folder as a service.
#
# KEY POINT — Vite bakes VITE_API_URL into the JS bundle at
# build time. You MUST set VITE_API_URL in Railway's Variables
# tab BEFORE the first deploy, otherwise the bundle will
# point at localhost and API calls will fail in production.
#
# Docs: https://docs.railway.app/reference/config-as-code
# ─────────────────────────────────────────────────────────────

[build]
# Use the Dockerfile in this directory.
# Railway will pass any VITE_* Variables as build ARGs
# automatically, so VITE_API_URL gets embedded into the bundle.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Nginx listens on port 80 inside the container.
# Railway maps this to a public HTTPS URL automatically.
startCommand = "nginx -g 'daemon off;'"

# Health check — a 200 on / means nginx is serving files.
healthcheckPath = "/"
healthcheckTimeout = 10

numReplicas = 1

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
